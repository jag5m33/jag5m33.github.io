<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jag Sandhu</title>
  <link rel="stylesheet" href="style.css">
  <!-- maths, and colour for code blocks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>

  <!-- 1. THE BOOK -->
  <div class="scene">
    <div class="book" id="book">
      <div class="page">
        <h2>Jag Sandhu</h2>
        <p>Data · ML · Analysis</p>
      </div>
      <div class="cover">
        <div class="cover-front">
          <h1>Jag Sandhu</h1>
          <p>Portfolio</p>
          <span class="hint">click to open</span>
        </div>
        <div class="cover-back"></div>
      </div>
    </div>
  </div>

  <!-- 2. THE MIND MAP (drawn by script.js) -->
  <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
  <p id="map-hint">Click a gold branch to open it · click a topic to read it · click the book to close</p>

  <!-- 3. THE READER (full-screen chapter or project page) -->
  <section id="reader" aria-hidden="true">
    <header class="reader-bar">
      <button id="back" type="button">← Map</button>
      <nav id="crumbs"></nav>
    </header>
    <div class="reader-scroll" id="reader-scroll">
      <article id="paper" class="paper"></article>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
