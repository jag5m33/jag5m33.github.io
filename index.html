<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jag Sandhu</title>
  <link rel="stylesheet" href="style.css?v=20261026b">
  <!-- maths, and colour for code blocks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>

  <!-- 1. THE ORB (drawn by orb.js) -->
  <div id="intro" role="button" tabindex="0" aria-label="Open the map">
    <canvas id="orb"></canvas>
    <div class="intro-text">
      <h1>Jag Sandhu</h1>
      <p>Data science · Machine learning · Analysis</p>
      <span class="hint">click the sphere to explore</span>
    </div>
  </div>

  <!-- 2. THE MIND MAP (drawn by script.js) -->
  <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
  <p id="map-hint">Notes on the left, projects on the right · hover to see what connects · scroll to zoom, drag to move · click the centre sphere to go back</p>
  <div id="zoom" aria-label="Zoom">
    <button id="zoom-in" type="button" title="Zoom in">+</button>
    <button id="zoom-out" type="button" title="Zoom out">−</button>
    <button id="zoom-fit" type="button" title="Show everything">⤢</button>
  </div>

  <!-- 2b. PHONE VIEW: the same map as a numbered list (small screens only) -->
  <nav id="index" aria-label="Contents"></nav>

  <!-- 3. THE READER (full-screen chapter or project page) -->
  <section id="reader" aria-hidden="true">
    <header class="reader-bar">
      <button id="back" type="button">← Map</button>
      <nav id="crumbs"></nav>
    </header>
    <div class="reader-scroll" id="reader-scroll">
      <article id="paper" class="paper"></article>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="orb.js?v=20261026b"></script>
  <script src="script.js?v=20261026b"></script>

  <!-- visitor stats (GoatCounter): counts every chapter and project page, not just the first load -->
  <script>
    window.goatcounter = { no_onload: true };
    function track() {
      if (window.goatcounter && window.goatcounter.count)
        window.goatcounter.count({ path: location.pathname + location.hash });
    }
    window.addEventListener("hashchange", track);
    window.addEventListener("load", track);
  </script>
  <script data-goatcounter="https://jag5m33.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
